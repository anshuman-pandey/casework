name: Refresh product screenshots
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/demo-browser.cjs
      - name: Save verified screenshots
        run: |
          cp test-results/demo-decision.png docs/assets/demo-decision.png
          cp test-results/demo-start.png docs/assets/demo-start.png
          cp test-results/demo-case.png docs/assets/demo-case.png
          cp test-results/demo-dark.png docs/assets/demo-dark.png
          cp test-results/demo-mobile.png docs/assets/demo-mobile.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/demo-*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public demo screenshots'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
