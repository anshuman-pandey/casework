name: Bug report
description: A reproducible failure in the implemented workflow.
title: "[Bug] "
body:
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Release/commit, OS, Python/Docker and browser versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce using synthetic data
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove tokens, personal information and real customer records.
