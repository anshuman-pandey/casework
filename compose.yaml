services:
  casework:
    build: .
    ports:
      - "127.0.0.1:${CASEWORK_PORT:-8080}:${CASEWORK_PORT:-8080}"
    environment:
      CASEWORK_PORT: "${CASEWORK_PORT:-8080}"
    volumes:
      - casework-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  casework-data:
